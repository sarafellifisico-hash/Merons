<!doctype html>
<html lang="en">
<head>
  <script>
  (() => {
    const nativeRAF = window.requestAnimationFrame.bind(window);
    let paused = false;
    window.requestAnimationFrame = callback => {
      const runner = time => paused ? nativeRAF(runner) : callback(time);
      return nativeRAF(runner);
    };
    addEventListener('message', event => {
      if (event.data?.type === 'TUIDG_TAB_ACTIVE') paused = !event.data.active;
    });
  })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Permanent Magnet Electric Generator</title>
  <style>
    :root{color-scheme:dark;--ink:#dde6f6;--muted:#71829f;--panel:rgba(12,16,25,.78);--line:#243044;--cyan:#7aa8ff;--copper:#d8752f}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071018;color:var(--ink);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}
    #scene{position:fixed;inset:0}canvas{display:block}
    .top{position:fixed;left:24px;top:20px;z-index:2;pointer-events:none}.eyebrow{color:var(--cyan);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.top h1{margin:4px 0 2px;font-size:clamp(22px,3vw,38px);letter-spacing:-.035em}.top p{margin:0;color:var(--muted);max-width:520px}
    .panel{position:fixed;z-index:3;right:20px;top:20px;width:290px;padding:20px;border:1px solid rgba(255,255,255,.075);border-radius:22px;background:var(--panel);box-shadow:0 24px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.045);backdrop-filter:blur(18px) saturate(1.25)}
    .panel h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 14px;color:#bcd0dd}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}.row label{color:#bfd0da}.value{font-variant-numeric:tabular-nums;color:var(--cyan)}
    input[type=range]{width:100%;accent-color:var(--cyan)}select{border:1px solid #416171;background:#10232d;color:white;border-radius:8px;padding:6px 8px}button{border:1px solid #416171;background:#152a35;color:white;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:650}button:hover{background:#1d3947}button.active{border-color:var(--cyan);background:#17404c}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.n{background:#ef4343}.s{background:#2387df}
    .note{position:fixed;left:24px;bottom:20px;color:#78909f;font-size:12px;z-index:2;pointer-events:none}.badge{position:fixed;bottom:20px;right:20px;z-index:2;padding:7px 10px;border:1px solid #294451;border-radius:999px;background:#08151dcc;color:#9fb4c1;font-size:11px}
    @media(max-width:720px){.top{left:16px;top:14px}.top p{display:none}.panel{left:12px;right:12px;top:auto;bottom:12px;width:auto}.note,.badge{display:none}}
  </style>
</head>
<body>
  <div id="scene"></div>
  <header class="top"><div class="eyebrow">Meronic Model · Cyclic Current</div><h1>Permanent Magnet Electric Generator</h1><p>A long fixed copper loop with two magnetic bars rotating freely around it.</p></header>
  <aside class="panel">
    <h2>Generator Controls</h2>
    <div class="row"><label for="speed">Rotor speed</label><span class="value" id="rpm">36 rpm</span></div>
    <input id="speed" type="range" min="0" max="120" value="36" step="1" aria-label="Rotor speed">
    <div class="row"><label for="mode">Cyclic Current</label><select id="mode"><option value="ac">Alternating (AC)</option><option value="dc+">Direct (+)</option><option value="dc-">Direct (−)</option></select></div>
    <div class="row"><label for="amplitude">Maximum amplitude</label><span class="value" id="ampValue">45°</span></div>
    <input id="amplitude" type="range" min="0" max="90" value="45" step="1" aria-label="Maximum Alpha Axis amplitude">
    <div class="actions"><button id="toggle">Start</button><button id="reset">Reset view</button></div>
    <div class="actions"><button id="field">Show flux</button><button id="micro">Microscopic view</button></div>
    <div class="row"><label for="labels">Identify poles</label><input id="labels" type="checkbox" checked></div>
    <div class="legend"><span><i class="dot n"></i>North</span><span><i class="dot s"></i>South</span><span><i class="dot" style="background:#d8752f"></i>Copper</span><span><i class="dot" style="background:#32e6a1"></i>Flux</span></div>
  </aside>
  <div class="note">Drag to rotate the camera · scroll to zoom</div><div class="badge">Simplified structure · no supports</div>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
    const host=document.querySelector('#scene'),scene=new THREE.Scene();scene.background=new THREE.Color(0x030609);scene.fog=new THREE.FogExp2(0x030609,.018);
    const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,100);camera.position.set(11,8,14);
    const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;host.append(renderer.domElement);
    const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,0);controls.minDistance=8;controls.maxDistance=28;
    scene.add(new THREE.HemisphereLight(0xb8ddff,0x080b0f,1.8));const key=new THREE.DirectionalLight(0xffffff,3.4);key.position.set(5,10,8);key.castShadow=true;scene.add(key);const fill=new THREE.PointLight(0x327dff,18,22);fill.position.set(-7,-3,-5);scene.add(fill);
    const copper=new THREE.MeshStandardMaterial({color:0xd96d20,metalness:.82,roughness:.2,emissive:0x4b1502,emissiveIntensity:.38});
    function openTube(points,r=.075,segments=180){const curve=new THREE.CatmullRomCurve3(points,false,'centripetal');const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,segments,r,12,false),copper);mesh.castShadow=true;return mesh}
    function closedTube(points,r=.105){const curve=new THREE.CatmullRomCurve3(points,true,'catmullrom',.04);const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,260,r,14,true),copper);mesh.castShadow=true;return mesh}
    // Espira única aberta à direita: as duas extremidades tornam-se os terminais da lâmpada.
    const loop=openTube([
      new THREE.Vector3(5.7,0,1.55),new THREE.Vector3(5.35,0,1.55),new THREE.Vector3(-5.35,0,1.55),
      new THREE.Vector3(-5.62,0,1.48),new THREE.Vector3(-5.75,0,1.2),new THREE.Vector3(-5.75,0,-1.2),
      new THREE.Vector3(-5.62,0,-1.48),new THREE.Vector3(-5.35,0,-1.55),new THREE.Vector3(5.35,0,-1.55),new THREE.Vector3(5.7,0,-1.55)
    ],.105,280);scene.add(loop);
    // Duas filas de 12 Compalphas, coplanares ao plano XZ da espira.
    const compalphas=[];
    const whiteLine=new THREE.LineBasicMaterial({color:0xf4f7ff,transparent:true,opacity:.9});
    const blueLine=new THREE.LineBasicMaterial({color:0x247cff,transparent:true,opacity:.48,blending:THREE.AdditiveBlending,depthWrite:false});
    const axisMat=new THREE.LineBasicMaterial({color:0xff4747,transparent:true,opacity:.98});
    function meridianLayer(radius,material,count=24){const layer=new THREE.Group();for(let m=0;m<count;m++){const u=m/count*Math.PI*2,pts=[];for(let j=0;j<=48;j++){const v=j/48*Math.PI*2,rr=radius*(1+Math.cos(v));pts.push(new THREE.Vector3(rr*Math.cos(u),rr*Math.sin(u),radius*Math.sin(v)))}layer.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),material))}return layer}
    function createCompalpha(x,z,index,row){const group=new THREE.Group();group.position.set(x,0,z);group.add(meridianLayer(.13,whiteLine,24),meridianLayer(.65,blueLine,24));
      const axisPts=[new THREE.Vector3(0,0,-.82),new THREE.Vector3(0,0,.82)];const axis=new THREE.Line(new THREE.BufferGeometry().setFromPoints(axisPts),axisMat);group.add(axis);
      const alpha=((index*137.508+row*43.7+17)%360)*Math.PI/180;group.rotation.y=alpha;scene.add(group);compalphas.push({group,initial:alpha,current:alpha,row});
    }
    for(const row of [-1,1])for(let i=0;i<12;i++)createCompalpha(-4.95+i*(9.9/11),row*1.55,i,row);
    // Duas barras longas e opostas; nenhum eixo, braço ou suporte é desenhado.
    const magnets=new THREE.Group();scene.add(magnets);const labels=[];
    const redMat=new THREE.MeshStandardMaterial({color:0xe5353f,metalness:.48,roughness:.24,emissive:0x390307,emissiveIntensity:.35});
    const blueMat=new THREE.MeshStandardMaterial({color:0x1676d2,metalness:.5,roughness:.24,emissive:0x021a38,emissiveIntensity:.4});
    function sprite(text,color){const c=document.createElement('canvas');c.width=128;c.height=128;const q=c.getContext('2d');q.fillStyle=color;q.font='bold 76px Arial';q.textAlign='center';q.textBaseline='middle';q.fillText(text,64,68);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.scale.set(.72,.72,.72);labels.push(s);return s}
    function addMagnet(side){const y=side*2.75,th=.44;const north=new THREE.Mesh(new THREE.BoxGeometry(10.7,th,.82),redMat);const south=new THREE.Mesh(new THREE.BoxGeometry(10.7,th,.82),blueMat);
      // Mesma orientação polar global nas duas barras: entre elas, N fica diante de S.
      north.position.set(0,y+th/2,0);south.position.set(0,y-th/2,0);north.castShadow=south.castShadow=true;magnets.add(north,south);
      const n=sprite('N','#ffe4e4'),s=sprite('S','#e1f2ff');n.position.set(0,y+.28,.43);s.position.set(0,y-.28,.43);magnets.add(n,s)}addMagnet(1);addMagnet(-1);
    // Linhas opcionais do fluxo N → S, solidárias à rotação das barras.
    const fieldLines=new THREE.Group();fieldLines.visible=false;magnets.add(fieldLines);const fieldMat=new THREE.LineBasicMaterial({color:0x32e6a1,transparent:true,opacity:.72,blending:THREE.AdditiveBlending,depthWrite:false});
    for(let i=0;i<9;i++){const x=-4.8+i*1.2;for(const bow of [-.22,.22]){const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(x,-2.5,0),new THREE.Vector3(x+bow,-1.15,.22*bow),new THREE.Vector3(x-bow,0,.35*bow),new THREE.Vector3(x+bow,1.15,.22*bow),new THREE.Vector3(x,2.5,0)]);fieldLines.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(36)),fieldMat))}const arrow=new THREE.ArrowHelper(new THREE.Vector3(0,1,0),new THREE.Vector3(x,-.45,0),.9,0x32e6a1,.18,.1);fieldLines.add(arrow)}
    // Prolongamentos contínuos, simétricos e suavemente curvados até os contatos da lâmpada.
    const lampX=7.35;
    const leadA=openTube([new THREE.Vector3(5.7,0,1.55),new THREE.Vector3(6.2,0,1.55),new THREE.Vector3(6.65,0,1.35),new THREE.Vector3(6.9,0,.9),new THREE.Vector3(7.02,0,.43),new THREE.Vector3(lampX,0,.38)],.105,110);
    const leadB=openTube([new THREE.Vector3(5.7,0,-1.55),new THREE.Vector3(6.2,0,-1.55),new THREE.Vector3(6.65,0,-1.35),new THREE.Vector3(6.9,0,-.9),new THREE.Vector3(7.02,0,-.43),new THREE.Vector3(lampX,0,-.38)],.105,110);scene.add(leadA,leadB);
    const contactMat=new THREE.MeshStandardMaterial({color:0xb9c2c7,metalness:.92,roughness:.18});
    for(const z of [-.41,.41]){const contact=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.22,24),contactMat);contact.rotation.x=Math.PI/2;contact.position.set(lampX,0,z);scene.add(contact)}
    const glassMat=new THREE.MeshPhysicalMaterial({color:0xffd889,emissive:0xff9d1c,emissiveIntensity:.45,transparent:true,opacity:.34,roughness:.08,transmission:.38,thickness:.12});
    const bulb=new THREE.Mesh(new THREE.SphereGeometry(.48,40,30),glassMat);bulb.scale.set(1,.72,1.15);bulb.position.set(lampX,0,0);scene.add(bulb);
    const filamentMat=new THREE.LineBasicMaterial({color:0xffd16a});const filament=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(lampX,0,-.28),new THREE.Vector3(lampX-.08,0,-.12),new THREE.Vector3(lampX+.08,0,0),new THREE.Vector3(lampX-.08,0,.12),new THREE.Vector3(lampX,0,.28)]),filamentMat);scene.add(filament);
    const glow=new THREE.PointLight(0xffa526,6,5);glow.position.copy(bulb.position);scene.add(glow);
    let running=false,rpm=36,maxAmplitude=Math.PI/4,runElapsed=0,last=performance.now(),microView=false;const speed=document.querySelector('#speed'),rpmOut=document.querySelector('#rpm'),toggle=document.querySelector('#toggle'),mode=document.querySelector('#mode'),amplitude=document.querySelector('#amplitude'),ampValue=document.querySelector('#ampValue');
    speed.oninput=()=>{rpm=+speed.value;rpmOut.textContent=rpm+' rpm'};amplitude.oninput=()=>{maxAmplitude=THREE.MathUtils.degToRad(+amplitude.value);ampValue.textContent=amplitude.value+'°'};
    toggle.onclick=()=>{running=!running;if(running)runElapsed=0;toggle.textContent=running?'Pause':'Start'};document.querySelector('#labels').onchange=e=>labels.forEach(v=>v.visible=e.target.checked);
    const fieldButton=document.querySelector('#field');fieldButton.onclick=()=>{fieldLines.visible=!fieldLines.visible;fieldButton.classList.toggle('active',fieldLines.visible);fieldButton.textContent=fieldLines.visible?'Hide flux':'Show flux'};
    const microButton=document.querySelector('#micro');microButton.onclick=()=>{microView=!microView;microButton.classList.toggle('active',microView);microButton.textContent=microView?'Overview':'Microscopic view';if(microView){controls.target.set(.45,0,1.55);camera.position.set(2.35,1.35,3.35)}else{controls.target.set(0,0,0);camera.position.set(11,8,14)}};
    document.querySelector('#reset').onclick=()=>{microView=false;microButton.classList.remove('active');microButton.textContent='Microscopic view';camera.position.set(11,8,14);controls.target.set(0,0,0)};
    function shortestTurn(from,to){return Math.atan2(Math.sin(to-from),Math.cos(to-from))}
    function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;if(running){magnets.rotation.x+=rpm*Math.PI*2/60*dt;runElapsed+=dt}
      // A resposta avança da extremidade esquerda para a lâmpada. Cada Compalpha recebe
      // a mesma Corrente Cíclica com um pequeno atraso proporcional à sua posição.
      const phase=magnets.rotation.x;
      for(const c of compalphas){const progress=(c.group.position.x+4.95)/9.9,delayed=phase-progress*.72;const influence=running?Math.pow(Math.abs(Math.sin(delayed)),8):0;let flux;
        if(mode.value==='ac')flux=c.row>0?(Math.sin(delayed)>=0?0:Math.PI):(Math.sin(delayed)>=0?Math.PI:0);else flux=mode.value==='dc+'?0:Math.PI;
        let allowed=THREE.MathUtils.clamp(shortestTurn(c.initial,flux),-maxAmplitude,maxAmplitude);if(mode.value==='dc+')allowed=Math.abs(allowed);if(mode.value==='dc-')allowed=-Math.abs(allowed);
        const waveArrived=running?THREE.MathUtils.smoothstep(runElapsed-progress*1.15,0,.35):0;const target=c.initial+allowed*influence*waveArrived;c.current=THREE.MathUtils.damp(c.current,target,9,dt);c.group.rotation.y=c.current}
      const lampArrival=THREE.MathUtils.smoothstep(runElapsed-1.15,0,.45),power=running?Math.min(rpm/70,1)*lampArrival:0;glassMat.emissiveIntensity=.12+power*2.6;filamentMat.color.setRGB(1,.35+power*.45,.08);glow.intensity=power*9;controls.update();renderer.render(scene,camera)}requestAnimationFrame(animate);
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  </script>
</body>
