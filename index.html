<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="TUIDG interactive simulations of Rotating Interaction, Cyclical Interaction and Cyclic Current.">
  <title>TUIDG — Interactive Mechanisms</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Sans:wght@400;500;600;700&display=swap');
    :root{
      color-scheme:dark;
      --ink:#020208;--panel:#0e131d;--panel2:#151c29;--stroke:#243044;
      --text:#dde6f6;--soft:#a6b2ca;--muted:#71829f;--accent:#7aa8ff;
      --header-h:68px;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:"Instrument Sans",system-ui,sans-serif}
    .appbar{
      position:fixed;z-index:1000;inset:0 0 auto 0;height:var(--header-h);display:grid;
      grid-template-columns:minmax(210px,1fr) auto minmax(150px,1fr);align-items:center;gap:18px;
      padding:10px 16px;background:rgba(8,12,19,.92);border-bottom:1px solid rgba(255,255,255,.085);
      box-shadow:0 12px 34px rgba(0,0,0,.34);backdrop-filter:blur(18px) saturate(1.25)
    }
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .mark{width:36px;height:36px;border:1px solid #3a5d9e;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#1c2d4e,#111928);box-shadow:inset 0 1px 0 #ffffff12;color:#a8c0ff;font:700 12px "Fragment Mono",monospace;letter-spacing:-.06em}
    .brand-copy{min-width:0}.eyebrow{font:700 10px "Fragment Mono",monospace;letter-spacing:.14em;color:#7d8caa;text-transform:uppercase;white-space:nowrap}.brand-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tabs{display:flex;align-items:center;gap:6px;padding:5px;border:1px solid #26334a;border-radius:14px;background:#0b111b;box-shadow:inset 0 1px 0 #ffffff0a}
    .tab{appearance:none;border:1px solid transparent;border-radius:10px;background:transparent;color:#8796b2;padding:9px 14px;cursor:pointer;font:600 12px "Fragment Mono",monospace;white-space:nowrap;transition:.16s ease}
    .tab:hover{color:#dbe8ff;background:#141d2d}.tab[aria-selected="true"]{color:#eef4ff;background:#1a2842;border-color:#3a5d9e;box-shadow:0 5px 18px #0005,inset 0 1px 0 #ffffff0c}
    .tools{display:flex;justify-content:flex-end;align-items:center;gap:10px}.number{color:#667896;font:500 11px "Fragment Mono",monospace;white-space:nowrap}.external{border:1px solid #2e3b55;background:#151e2d;color:#b9c7e2;border-radius:10px;padding:8px 11px;text-decoration:none;font:600 11px "Fragment Mono",monospace;white-space:nowrap}.external:hover{background:#1b2940;color:#fff;border-color:#3b5788}
    .stage{position:fixed;inset:var(--header-h) 0 0;background:#020208}
    .sim{position:absolute;inset:0;width:100%;height:100%;border:0;background:#020208;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease}
    .sim.active{opacity:1;visibility:visible;pointer-events:auto}
    .noscript{position:fixed;inset:var(--header-h) 0 0;display:grid;place-items:center;color:var(--soft);padding:30px;text-align:center}
    @media(max-width:980px){
      :root{--header-h:116px}.appbar{height:var(--header-h);grid-template-columns:1fr auto;grid-template-rows:44px 52px;padding:8px 12px;gap:4px 10px}.tabs{grid-column:1/-1;grid-row:2;width:100%;overflow-x:auto;justify-content:flex-start}.tab{flex:1}.number{display:none}
    }
    @media(max-width:620px){
      :root{--header-h:110px}.appbar{grid-template-columns:1fr auto}.brand-title{font-size:13px}.mark{width:32px;height:32px}.external{padding:8px 9px}.external span{display:none}.tabs{border-radius:12px}.tab{padding:8px 10px;font-size:10.5px}
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="brand" aria-label="TUIDG interactive mechanisms">
      <div class="mark" aria-hidden="true">Tα</div>
      <div class="brand-copy"><div class="eyebrow">The Universe as Immaterial Geometry</div><div class="brand-title">Interactive Mechanisms</div></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="TUIDG simulations">
      <button class="tab" id="tab-rotating" role="tab" aria-selected="true" aria-controls="panel-rotating" data-target="rotating">Rotating Interaction</button>
      <button class="tab" id="tab-cyclical" role="tab" aria-selected="false" aria-controls="panel-cyclical" data-target="cyclical" tabindex="-1">Cyclical Interaction</button>
      <button class="tab" id="tab-laboratory" role="tab" aria-selected="false" aria-controls="panel-laboratory" data-target="laboratory" tabindex="-1">IC 2D Laboratory</button>
      <button class="tab" id="tab-current" role="tab" aria-selected="false" aria-controls="panel-current" data-target="current" tabindex="-1">Cyclic Current</button>
    </nav>
    <div class="tools"><span class="number" id="mechanismNumber">Mechanism 01 / 04</span><a class="external" id="openStandalone" href="rotating-interaction.html" target="_blank" rel="noopener" title="Open the active simulation in a separate window"><span>Open separately</span> ↗</a></div>
  </header>

  <main class="stage">
    <iframe class="sim active" id="panel-rotating" role="tabpanel" aria-labelledby="tab-rotating" title="Rotating Interaction — Meronic Builder" src="rotating-interaction.html" data-key="rotating"></iframe>
    <iframe class="sim" id="panel-cyclical" role="tabpanel" aria-labelledby="tab-cyclical" title="Cyclical Interaction 2D–3D" data-src="cyclical-interaction.html" data-key="cyclical"></iframe>
    <iframe class="sim" id="panel-laboratory" role="tabpanel" aria-labelledby="tab-laboratory" title="Cyclical Interaction 2D Laboratory" data-src="ic-2d-laboratory.html" data-key="laboratory"></iframe>
    <iframe class="sim" id="panel-current" role="tabpanel" aria-labelledby="tab-current" title="Cyclic Current — Permanent Magnet Electric Generator" data-src="cyclic-current.html" data-key="current"></iframe>
  </main>
  <noscript><div class="noscript">JavaScript is required to open the TUIDG interactive simulations.</div></noscript>

  <script>
    (() => {
      const order = ['rotating','cyclical','laboratory','current'];
      const labels = {
        rotating:'rotating-interaction.html',
        cyclical:'cyclical-interaction.html',
        laboratory:'ic-2d-laboratory.html',
        current:'cyclic-current.html'
      };
      const tabs = [...document.querySelectorAll('.tab')];
      const frames = [...document.querySelectorAll('.sim')];
      const count = document.querySelector('#mechanismNumber');
      const standalone = document.querySelector('#openStandalone');

      function notifyFrames(activeKey){
        frames.forEach(frame => {
          if (frame.contentWindow) frame.contentWindow.postMessage({type:'TUIDG_TAB_ACTIVE',active:frame.dataset.key===activeKey}, '*');
        });
      }

      function activate(key, updateHash=true){
        if (!order.includes(key)) key='rotating';
        const index=order.indexOf(key);
        tabs.forEach(tab => {
          const active=tab.dataset.target===key;
          tab.setAttribute('aria-selected', String(active));
          tab.tabIndex=active?0:-1;
        });
        frames.forEach(frame => {
          const active=frame.dataset.key===key;
          if (active && !frame.getAttribute('src')) frame.src=frame.dataset.src;
          frame.classList.toggle('active',active);
          frame.setAttribute('aria-hidden',String(!active));
        });
        count.textContent=`Mechanism ${String(index+1).padStart(2,'0')} / ${String(order.length).padStart(2,'0')}`;
        standalone.href=labels[key];
        standalone.title=`Open ${tabs[index].textContent} in a separate window`;
        document.title=`${tabs[index].textContent} — TUIDG`;
        if(updateHash) history.replaceState(null,'',`#${key}`);
        requestAnimationFrame(()=>notifyFrames(key));
      }

      tabs.forEach(tab => {
        tab.addEventListener('click',()=>activate(tab.dataset.target));
        tab.addEventListener('keydown',event=>{
          if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
          event.preventDefault();
          const current=order.indexOf(tab.dataset.target);
          const next=event.key==='Home'?0:event.key==='End'?order.length-1:(current+(event.key==='ArrowRight'?1:-1)+order.length)%order.length;
          tabs[next].focus();activate(order[next]);
        });
      });
      frames.forEach(frame=>frame.addEventListener('load',()=>notifyFrames(location.hash.slice(1)||'rotating')));
      addEventListener('hashchange',()=>activate(location.hash.slice(1),false));
      activate(location.hash.slice(1)||'rotating',false);
    })();
  </script>
</body>
</html>
